<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5월 급량비 결제</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: '맑은 고딕', 'Malgun Gothic', sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.12);
      padding: 32px 40px;
      width: 100%;
      max-width: 720px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 24px;
      color: #1a1a1a;
      border-bottom: 2px solid #333;
      padding-bottom: 12px;
    }

    .page-title[contenteditable="true"]:focus {
      outline: 2px solid #4a90e2;
      border-radius: 4px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    thead th {
      background: #e8edf3;
      font-weight: 700;
      padding: 10px 14px;
      text-align: center;
      border: 1px solid #b0b8c4;
      color: #2c3e50;
    }

    tbody td {
      border: 1px solid #c8d0da;
      padding: 9px 14px;
      text-align: center;
      color: #2c3e50;
    }

    tbody td[contenteditable="true"] { cursor: text; }
    tbody td[contenteditable="true"]:hover { background: #f4f8ff; }
    tbody td[contenteditable="true"]:focus { outline: 2px solid #4a90e2; background: #eaf3ff; }

    tbody tr:nth-child(even) td { background: #f7f9fc; }
    tbody tr:nth-child(even) td[contenteditable="true"]:hover { background: #eef4ff; }

    .td-amount, .td-balance { text-align: right; }
    .td-num { width: 50px; font-weight: 600; color: #555; }
    .td-delete { width: 36px; padding: 4px !important; border: 1px solid #c8d0da; }

    .btn-delete {
      background: none; border: none; color: #c0392b;
      font-size: 16px; cursor: pointer; padding: 2px 6px;
      border-radius: 4px; opacity: 0.6;
    }
    .btn-delete:hover { opacity: 1; background: #fdecea; }

    tfoot td {
      border: 1px solid #b0b8c4;
      padding: 10px 14px;
      font-weight: 700;
      background: #e8edf3;
      color: #1a1a1a;
    }
    .tfoot-total { text-align: right; color: #c0392b; }

    .actions {
      display: flex; gap: 10px; margin-top: 20px;
      justify-content: flex-end; flex-wrap: wrap;
    }

    .btn {
      padding: 9px 20px; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    .btn-add  { background: #2ecc71; color: #fff; }
    .btn-add:hover  { background: #27ae60; }
    .btn-save { background: #4a90e2; color: #fff; }
    .btn-save:hover { background: #2e7bd1; }
    .btn-reset { background: #e0e0e0; color: #555; }
    .btn-reset:hover { background: #c8c8c8; }

    .hint { margin-top: 14px; font-size: 12px; color: #999; text-align: center; }

    .toast {
      position: fixed; bottom: 30px; left: 50%;
      transform: translateX(-50%) translateY(60px);
      background: #333; color: #fff; padding: 10px 22px;
      border-radius: 24px; font-size: 14px; opacity: 0;
      transition: all 0.3s ease; pointer-events: none; z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="container">
  <div class="page-title" contenteditable="true" id="pageTitle">5월 급량비 결제</div>

  <table>
    <thead>
      <tr>
        <th style="width:50px">번호</th>
        <th>급식처</th>
        <th>결제액</th>
        <th>잔액</th>
        <th style="width:36px"></th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr>
        <td class="td-num" contenteditable="true">1</td>
        <td contenteditable="true">포텐</td>
        <td class="td-amount" contenteditable="true">135,000</td>
        <td class="td-balance" contenteditable="true"></td>
        <td class="td-delete"><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
      </tr>
      <tr>
        <td class="td-num" contenteditable="true">2</td>
        <td contenteditable="true">사랑해베이글</td>
        <td class="td-amount" contenteditable="true">108,000</td>
        <td class="td-balance" contenteditable="true"></td>
        <td class="td-delete"><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
      </tr>
      <tr>
        <td class="td-num" contenteditable="true">3</td>
        <td contenteditable="true">고려짬뽕</td>
        <td class="td-amount" contenteditable="true">135,000</td>
        <td class="td-balance" contenteditable="true"></td>
        <td class="td-delete"><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
      </tr>
      <tr>
        <td class="td-num" contenteditable="true">4</td>
        <td contenteditable="true">건하은칼국수</td>
        <td class="td-amount" contenteditable="true">90,000</td>
        <td class="td-balance" contenteditable="true"></td>
        <td class="td-delete"><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
      </tr>
      <tr>
        <td class="td-num" contenteditable="true">1</td>
        <td contenteditable="true">신공주칼국수</td>
        <td class="td-amount" contenteditable="true">135,000</td>
        <td class="td-balance" contenteditable="true"></td>
        <td class="td-delete"><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
      </tr>
      <tr>
        <td class="td-num" contenteditable="true">2</td>
        <td contenteditable="true">장혁민의부대찌개</td>
        <td class="td-amount" contenteditable="true">117,000</td>
        <td class="td-balance" contenteditable="true"></td>
        <td class="td-delete"><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
      </tr>
      <tr>
        <td class="td-num" contenteditable="true">3</td>
        <td contenteditable="true">남가네설악추어탕</td>
        <td class="td-amount" contenteditable="true">135,000</td>
        <td class="td-balance" contenteditable="true"></td>
        <td class="td-delete"><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td colspan="2" style="text-align:center;font-weight:700">합계</td>
        <td class="tfoot-total" id="totalAmount">855,000</td>
        <td></td>
        <td></td>
      </tr>
    </tfoot>
  </table>

  <div class="actions">
    <button class="btn btn-reset" onclick="resetConfirm()">초기화</button>
    <button class="btn btn-add"   onclick="addRow()">+ 행 추가</button>
    <button class="btn btn-save"  onclick="saveToFile()">내보내기</button>
  </div>
  <p class="hint">셀을 클릭하면 바로 편집할 수 있습니다</p>
</div>

<div class="toast" id="toast"></div>

<script>
  function parseAmount(str) {
    return parseInt((str || "").replace(/[^0-9]/g, ""), 10) || 0;
  }

  function updateTotal() {
    let total = 0;
    document.querySelectorAll("#tableBody .td-amount").forEach(td => {
      total += parseAmount(td.textContent);
    });
    document.getElementById("totalAmount").textContent = total.toLocaleString("ko-KR");
  }

  // 셀 변경 시 합계 업데이트
  document.getElementById("tableBody").addEventListener("input", function(e) {
    if (e.target.classList.contains("td-amount")) updateTotal();
  });

  function deleteRow(btn) {
    const rows = document.querySelectorAll("#tableBody tr");
    if (rows.length <= 1) { showToast("마지막 행은 삭제할 수 없습니다."); return; }
    btn.closest("tr").remove();
    updateTotal();
  }

  function addRow() {
    const tbody = document.getElementById("tableBody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="td-num" contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td class="td-amount" contenteditable="true"></td>
      <td class="td-balance" contenteditable="true"></td>
      <td class="td-delete"><button class="btn-delete" onclick="deleteRow(this)">✕</button></td>
    `;
    tbody.appendChild(tr);
    tr.querySelector("[contenteditable]").focus();
  }

  function resetConfirm() {
    if (confirm("원본 데이터로 초기화할까요?")) location.reload();
  }

  function saveToFile() {
    const html = document.documentElement.outerHTML;
    const blob = new Blob([html], { type: "text/html;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = document.getElementById("pageTitle").textContent.trim() + ".html";
    a.click();
    showToast("파일로 저장되었습니다 ✓");
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2200);
  }

  // 초기 합계 계산
  updateTotal();
</script>
</body>
</html>
